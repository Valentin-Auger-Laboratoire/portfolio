    const nf = (x, d) => C.nf(x, d, L.lang);
    const g = (x) => (Number.isFinite(x) ? (Math.abs(x) >= 1e4 ? x.toExponential(2) : Math.abs(x) < 5e-4 ? nf(0, 3) : nf(x, Math.abs(x) >= 100 ? 1 : 3)) : '—');
    const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);

    function remplirStatique() {
      const t = L.t;
      $('scen').innerHTML = SCEN.map((s, i) => `<button type="button" class="btn" data-sc="${i}">${t(s.k)}</button>`).join('');
      $('types').innerHTML = [1, 2, 3, 4].map((k) => `<button type="button" class="btn" data-ty="${k}">${t('t' + k)}</button>`).join('');
      $('modele').innerHTML = `<option value="0">${t('auto')}</option>` + [1, 2, 3, 4].map((k) => `<option value="${k}">${t('t' + k)}</option>`).join('');
      $('modele').value = String(modeleChoisi);
      $('verif').innerHTML = ['v1', 'v2', 'v3', 'v4', 'v5', 'v6', 'v7'].map((k) => `<li>${t(k)}</li>`).join('');
      document.querySelectorAll('[data-sc]').forEach((b) => b.addEventListener('click', () => appliquerScenario(+b.dataset.sc)));
      document.querySelectorAll('[data-ty]').forEach((b) => b.addEventListener('click', () => { type = +b.dataset.ty; importe = null; sc = -1; plages(true); effacerMC(); maj(); }));
    }
    let modeleChoisi = 0;

    function plages(milieu) {
      const [[a0, b0], [a1, b1]] = PLAGES[type];
      Object.assign($('p0'), { min: a0, max: b0 }); Object.assign($('p1'), { min: a1, max: b1 });
      if (milieu) { $('p0').value = type === 3 ? 2 : type === 4 ? 1.2 : 2; $('p1').value = type === 3 ? -0.3 : type === 4 ? 2 : 1; }
    }
    function appliquerScenario(i) {
      const s = SCEN[i]; sc = i; importe = null; type = s.type; tb = s.tb; plages(false);
      $('p0').value = s.p0; $('p1').value = s.p1; $('sigma').value = s.sigma; $('mu').value = s.mu; $('n').value = s.n; $('xmax').value = s.xmax;
      modeleChoisi = 0; $('modele').value = '0'; graine = 2026; effacerMC(); maj();
    }

    function options() {
      return { type, p0: +$('p0').value, p1: +$('p1').value, sigma: +$('sigma').value, mu: +$('mu').value, typeBruit: tb, n: +$('n').value, xmin: 0.1, xmax: +$('xmax').value, graine, modele: modeleChoisi };
    }

    function histogramme(v, nb) {
      const f = v.filter(Number.isFinite); if (!f.length) return null;
      let a = Math.min(...f), b = Math.max(...f); if (a === b) { a -= 0.5; b += 0.5; }
      const w = (b - a) / nb, c = new Array(nb).fill(0);
      f.forEach((x) => { c[Math.min(nb - 1, Math.floor((x - a) / w))]++; });
      return { a, b, w, c, dens: c.map((k) => k / (f.length * w)) };
    }
    const escalier = (h) => {
      const xs = [h.a], ys = [0];
      h.dens.forEach((d, i) => { xs.push(h.a + i * h.w, h.a + (i + 1) * h.w); ys.push(d, d); });
      xs.push(h.b); ys.push(0); return { x: xs, y: ys };
    };

    function maj() {
      const t = L.t;
      document.querySelectorAll('[data-sc]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.sc === sc && !importe)));
      document.querySelectorAll('[data-ty]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.ty === type && !importe)));
      document.querySelectorAll('[data-tb]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.tb === tb)));
      ['p0', 'p1'].forEach((k) => { $('o' + k).textContent = nf(+$(k).value, 2); });
      $('osigma').textContent = nf(+$('sigma').value, 2); $('omu').textContent = nf(+$('mu').value, 1);
      $('on').textContent = $('n').value; $('oxmax').textContent = nf(+$('xmax').value, 1);
      $('formule').textContent = t('f' + type);
      const o = options();
      let sim;
      if (importe) {
        const ori = S.analyseOrigine(importe.x, importe.y), cor = S.analyseCorrigee(importe.x, importe.y);
        sim = { x: importe.x, y: importe.y, ySys: null, b: null, ori, cor, choixOri: ori.stats[(o.modele || ori.meilleur) - 1], choixCor: cor.stats[(o.modele || cor.meilleur) - 1] };
      } else sim = S.simuler(o);
      dernier = sim;
      const co = sim.choixOri, cc = sim.choixCor;
      const vrai = !importe;
      // tableau de comparaison
      const rms = (st) => (vrai ? Math.sqrt(S.simuSys(sim.x, st.type, st.p0, st.p1).reduce((s, v, i) => s + (v - sim.ySys[i]) ** 2, 0) / sim.x.length) : NaN);
      const pm = (v, d) => (Number.isFinite(d) ? `${g(v)} ± ${g(d)}` : g(v));
      const rows = [
        [t('rMod'), t('t' + co.type), t('t' + cc.type), vrai ? t('t' + type) : t('inconnu')],
        [t('rP0'), g(co.p0), pm(cc.p0, cc.d0), vrai ? g(o.p0) : '—'],
        [t('rP1'), g(co.p1), pm(cc.p1, cc.d1), vrai ? g(o.p1) : '—'],
        [t('rSig'), vrai ? fmt(t('sigCopie'), { s: g(o.sigma) }) : '—', g(cc.sigma), vrai ? g(tb === 1 ? o.sigma : o.sigma / Math.sqrt(3)) : '—'],
        [t('rR2'), nf(co.R2, 4), nf(cc.R2, 4), ''],
        [t('rEqm'), g(rms(co)), g(rms(cc)), vrai ? '0' : ''],
      ];
      $('cmp').innerHTML = `<tr><th>${t('thV')}</th><th>${t('thO')}</th><th>${t('thC')}</th><th>${t('thR')}</th></tr>` + rows.map((r) => `<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('');
      let v = '';
      if (vrai && !o.modele) {
        if (co.type === type && cc.type === type) v = t('vBon');
        else if (cc.type === type) v = fmt(t('vOriFaux'), { o: t('t' + co.type).toLowerCase(), v: t('t' + type).toLowerCase() });
        else v = fmt(t('vCorFaux'), { c: t('t' + cc.type).toLowerCase() });
      }
      const coupes = sim.ori.stats[co.type - 1].coupes;
      if ((co.type === 3 || co.type === 4) && coupes) v += fmt(t('vCoupes'), { k: coupes });
      if (vrai && o.mu) v += fmt(t('vMu'), { m: nf(o.mu, 1) });
      $('verdict').textContent = v.trim();
      // graphique principal
      const xs = S.linspace(Math.min(...sim.x), Math.max(...sim.x), 400);
      const yo = S.simuSys(xs, co.type, co.p0, co.p1), yc = S.simuSys(xs, cc.type, cc.p0, cc.p1);
      const yv = vrai ? S.simuSys(xs, type, o.p0, o.p1) : null;
      const tout = [...sim.y, ...yc, ...(yv || [])].filter(Number.isFinite);
      let ymin = Math.min(...tout), ymax = Math.max(...tout); const marge = (ymax - ymin) * 0.08 || 1;
      ymin -= marge; ymax += marge;
      const series = [{ x: sim.x, y: sim.y, color: '#6c6c70', points: true, r: sim.x.length > 300 ? 1.6 : 2.6 }];
      if (yv) series.push({ x: xs, y: yv, color: '#c9c9cc', width: 1.6, dash: [6, 4] });
      series.push({ x: xs, y: yo.map((y) => Math.max(ymin - 10 * marge, Math.min(ymax + 10 * marge, y))), color: '#e0a458', width: 2 });
      series.push({ x: xs, y: yc, color: '#c8102e', width: 2.2 });
      C.graphique($('cvMain'), { xmin: xs[0], xmax: xs[xs.length - 1], ymin, ymax, xlabel: 'x', ylabel: 'y', series });
      // résidus
      const rmax = Math.max(...cc.res.map(Math.abs)) * 1.1 || 1;
      C.graphique($('cvRes'), { xmin: xs[0], xmax: xs[xs.length - 1], ymin: -rmax, ymax: rmax, xlabel: 'x', ylabel: 'y − ŷ', hlignes: [{ y: 0, color: '#6c6c70' }],
        series: [{ x: sim.x, y: cc.res, color: '#c8102e', points: true, r: sim.x.length > 300 ? 1.4 : 2.2 }] });
      const su = cc.suites;
      $('suites').textContent = Number.isFinite(su.p) ? fmt(t(su.p > 0.01 ? 'suitesOk' : 'suitesKo'), { r: su.suites, e: nf(su.attendu, 1), p: su.p < 1e-4 ? su.p.toExponential(1) : nf(su.p, 3) }) : '';
      // histogramme du bruit (le même que celui ajouté)
      const bn = vrai ? sim.b.map((x) => x - o.mu) : cc.res;
      const h = histogramme(bn, Math.max(8, Math.min(40, Math.round(Math.sqrt(bn.length) * 1.5))));
      if (h) {
        const sg = vrai ? o.sigma : cc.sigma, tbb = vrai ? tb : 1;
        const xx = S.linspace(Math.min(h.a, -3 * sg || -1), Math.max(h.b, 3 * sg || 1), 300);
        const pdf = sg > 0 ? xx.map((z) => S.densiteBruit(z, sg, tbb)) : xx.map(() => 0);
        const es = escalier(h);
        C.graphique($('cvHist'), { xmin: xx[0], xmax: xx[xx.length - 1], ymin: 0, ymax: Math.max(...h.dens, ...pdf) * 1.1 || 1, xlabel: vrai ? 'b' : 'y − ŷ', ylabel: t('axD'),
          series: [{ x: es.x, y: es.y, color: '#8a8a8e', width: 1.4 }, { x: xx, y: pdf, color: '#c8102e', width: 2 }] });
      }
      // les 4 modèles
      $('mods').innerHTML = `<tr><th>${t('mNom')}</th><th class="n">${t('mR2o')}</th><th class="n">${t('mR2c')}</th><th>${t('mPo')}</th><th>${t('mPc')}</th><th>${t('mSu')}</th></tr>` +
        [0, 1, 2, 3].map((i) => {
          const a = sim.ori.stats[i], b = sim.cor.stats[i];
          const bo = a.type === sim.ori.meilleur, bc = b.type === sim.cor.meilleur;
          const sOk = b.suites && Number.isFinite(b.suites.p) ? (b.suites.p > 0.01 ? `<span class="pill ok">${t('oui')}</span>` : `<span class="pill ko">${t('non')}</span>`) : '';
          return `<tr><td>${t('t' + (i + 1))}</td><td class="n ${bo ? 'mid' : ''}">${nf(a.R2, 4)}</td><td class="n ${bc ? 'good' : ''}">${nf(b.R2, 4)}</td><td>${g(a.p0)} ; ${g(a.p1)}</td><td>${pm(b.p0, b.d0)} ; ${pm(b.p1, b.d1)}</td><td>${sOk}</td></tr>`;
        }).join('');
      $('mcInfo').textContent = importe ? t('mcCsv') : (dernierMC ? fmt(t('mcFait'), { t: nf(dernierMC.duree, 1) }) : '');
      $('mc').disabled = !!importe;
    }

    // Monte-Carlo par paquets (la page reste fluide)
    function lancerMC() {
      if (importe) return;
      const o = options(), N = 200, t0 = performance.now();
      const acc = { ori0: [], ori1: [], cor0: [], cor1: [], c0: 0, c1: 0, ok: 0, bo: 0, bc: 0 };
      let k = 0;
      $('mc').disabled = true;
      const paquet = () => {
        const fin = Math.min(N, k + 10);
        for (; k < fin; k++) {
          const r = S.monteCarlo({ ...o, graine: (o.graine * 31 + k) >>> 0 }, 1);
          acc.ori0.push(r.ori.p0[0]); acc.ori1.push(r.ori.p1[0]); acc.cor0.push(r.cor.p0[0]); acc.cor1.push(r.cor.p1[0]);
          acc.c0 += r.couv0; acc.c1 += r.couv1; acc.ok += r.ok; acc.bo += r.bonModeleOri; acc.bc += r.bonModeleCor;
        }
        $('mcInfo').textContent = fmt(L.t('mcCours'), { k });
        if (k < N) setTimeout(paquet, 0);
        else { afficherMC(o, acc, N, (performance.now() - t0) / 1000); $('mc').disabled = false; }
      };
      paquet();
    }
    let dernierMC = null;
    function effacerMC() { dernierMC = null; $('mcTab').innerHTML = ''; const c = $('cvMc'); c.getContext('2d').clearRect(0, 0, c.width, c.height); }
    function afficherMC(o, acc, N, duree) {
      dernierMC = { o, acc, N, duree };
      const t = L.t;
      const st = (v, vrai) => { const f = v.filter(Number.isFinite), m = f.reduce((s, x) => s + x, 0) / f.length; return { b: m - vrai, sd: Math.sqrt(f.reduce((s, x) => s + (x - m) ** 2, 0) / (f.length - 1)) }; };
      const pct = (x) => nf(100 * x, 0) + ' %';
      const r0o = st(acc.ori0, o.p0), r0c = st(acc.cor0, o.p0), r1o = st(acc.ori1, o.p1), r1c = st(acc.cor1, o.p1);
      $('mcTab').innerHTML = `<tr><th>${t('tP')}</th><th></th><th class="n">${t('tBi')}</th><th class="n">${t('tSd')}</th><th class="n">${t('tCo')}</th></tr>` +
        `<tr><td>p0</td><td class="mid">${t('lgOri')}</td><td class="n">${g(r0o.b)}</td><td class="n">${g(r0o.sd)}</td><td class="n">—</td></tr>` +
        `<tr><td></td><td>${t('lgCor')}</td><td class="n">${g(r0c.b)}</td><td class="n">${g(r0c.sd)}</td><td class="n">${pct(acc.c0 / acc.ok)}</td></tr>` +
        `<tr><td>p1</td><td class="mid">${t('lgOri')}</td><td class="n">${g(r1o.b)}</td><td class="n">${g(r1o.sd)}</td><td class="n">—</td></tr>` +
        `<tr><td></td><td>${t('lgCor')}</td><td class="n">${g(r1c.b)}</td><td class="n">${g(r1c.sd)}</td><td class="n">${pct(acc.c1 / acc.ok)}</td></tr>` +
        `<tr><td colspan="2">${t('tBon')}</td><td class="n mid" colspan="1">${pct(acc.bo / N)}</td><td class="n good" colspan="2">${pct(acc.bc / N)}</td></tr>`;
      const lim = (v) => { const f = v.filter(Number.isFinite).sort((a, b) => a - b); return [f[Math.floor(0.01 * f.length)], f[Math.ceil(0.99 * f.length) - 1]]; };
      const [a1, b1] = lim([...acc.ori1, ...acc.cor1, o.p1]);
      const bins = 30, w = (b1 - a1) / bins || 1;
      const hist = (v) => { const c = new Array(bins).fill(0); v.forEach((x) => { const i = Math.floor((x - a1) / w); if (i >= 0 && i < bins) c[i]++; }); return { a: a1, b: a1 + bins * w, w, dens: c.map((k) => k / N) }; };
      const ho = escalier(hist(acc.ori1)), hc = escalier(hist(acc.cor1));
      C.graphique($('cvMc'), { xmin: a1, xmax: a1 + bins * w, ymin: 0, ymax: Math.max(...ho.y, ...hc.y) * 1.15 || 1, xlabel: 'p1', ylabel: t('axMc'),
        series: [{ x: ho.x, y: ho.y, color: '#e0a458', width: 1.6 }, { x: hc.x, y: hc.y, color: '#c8102e', width: 2 }], vlignes: [{ x: o.p1, color: '#c9c9cc', dash: [5, 4] }] });
      $('mcInfo').textContent = fmt(t('mcFait'), { t: nf(duree, 1) });
    }

    document.querySelectorAll('[data-tb]').forEach((b) => b.addEventListener('click', () => { tb = +b.dataset.tb; sc = -1; effacerMC(); maj(); }));
    ['p0', 'p1', 'sigma', 'mu', 'n', 'xmax'].forEach((k) => $(k).addEventListener('input', () => { sc = -1; importe = null; effacerMC(); maj(); }));
    $('modele').addEventListener('change', () => { modeleChoisi = +$('modele').value; maj(); });
    $('tirage').addEventListener('click', () => { graine++; importe = null; maj(); });
    $('mc').addEventListener('click', lancerMC);
    $('exp').addEventListener('click', () => {
      if (!dernier || !dernier.ySys) return;
      $('csv').style.display = ''; $('csv').value = S.csv(dernier); $('csvInfo').textContent = L.t('csvExp');
      try { navigator.clipboard.writeText($('csv').value); } catch (e) {}
    });
    $('imp').addEventListener('click', () => { $('csv').style.display = ''; $('csv').value = ''; $('csvInfo').textContent = L.t('csvHint'); $('csv').focus(); });
    $('csv').addEventListener('input', () => {
      const d = S.lireCSV($('csv').value);
      if (d) { importe = d; $('csvInfo').textContent = fmt(L.t('csvOk'), { n: d.x.length }); maj(); }
      else if ($('csv').value.trim()) $('csvInfo').textContent = L.t('csvKo');
    });
    window.addEventListener('resize', () => { maj(); if (dernierMC) afficherMC(dernierMC.o, dernierMC.acc, dernierMC.N, dernierMC.duree); });
    window.__signaux = { scenario: appliquerScenario, mc: lancerMC };
    plages(false);
    L.appliquer(L.lang);
    appliquerScenario(0);
  })();
  </script>
</body>
